# Publica a app no GitHub Pages sempre que o ramo main muda, e todas as segundas-feiras
# para trazer os dados mais recentes do INE. Só publica se os testes passarem.
name: Publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      # Dados de referência do INE (preços e rendas por freguesia). Se o INE falhar, fica o ficheiro guardado no repositório.
      - run: node scripts/dados-ine.mjs
      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: publicacao
        uses: actions/deploy-pages@v4
